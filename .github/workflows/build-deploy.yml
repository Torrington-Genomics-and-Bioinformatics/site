name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy dist to deploy branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: deploy
          folder: dist

      # Direct SSH deploy — disabled for now. Port 9750 is this account's only open
      # SSH port and it only serves cPanel's own Git Version Control git-shell; general
      # SCP/shell access to it is rejected (confirmed: key shows "authorized" in
      # cPanel's SSH Access UI, but the server declines it outright during auth, and
      # the standard port 22 is closed entirely). Re-enable this step if the host ever
      # turns on general SSH/shell access for this account — the DEPLOY_SSH_KEY repo
      # secret is already set and ready to go.
